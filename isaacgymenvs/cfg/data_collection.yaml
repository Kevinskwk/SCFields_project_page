
# Task name - used to pick the class to load
task_name: ${task.name}
# experiment name. defaults to name of training config
experiment: ''
split: 'test'  # 'train', 'val', 'test'

# if set to positive integer, overrides the default number of environments
num_envs: 1
id: 0

# seed - set to -1 to choose random seed
seed: 42
# set to True for deterministic performance
torch_deterministic: False

# set the maximum number of learning iterations to train for. overrides default per-environment setting
max_iterations: ''

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: ${sim_device} #'cuda:0'
graphics_device_id: 0

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# used to set checkpoint path
checkpoint: ''
# set sigma when restoring network
sigma: ''
# set to True to use multi-gpu training
multi_gpu: False

wandb_activate: False
wandb_group: ''
wandb_name: ${train.params.config.name}
wandb_entity: ''
wandb_project: 'isaacgymenvs'
wandb_tags: []
wandb_logcode_dir: ''

capture_video: False
capture_video_freq: 100
capture_video_len: 100
force_render: True

# disables rendering
headless: True

# data collection config
max_collection_steps: 200
save_frequency: 200
output_dir: ${oc.env:SCFIELDS_ROOT,.}/data/sim/tools
data_format: "pickle"

# data validation config
validate_grasping: True  # Whether to validate and filter environments based on grasping
grasp_threshold: 0.1  # Force threshold (in Newtons) for considering object as grasped

scripted_policy:
  # Original without lifting:
  # press_duration: 150  # Number of steps to press the plug
  # slide_duration: 50  # Number of steps to slide the plug
  # approach_speed_range: [0.5, 1.5]   # Speed at which the end-effector approaches the plug
  # press_speed_range: [0.0, 0.02]  # Speed at which the plug presses into the socket
  # slide_speed_range: [0.0, 0.3]  # Speed at which the plug slides along the socket
  press_duration: 70  # Number of steps to press the plug
  slide_duration: 100  # Number of steps to slide the plug
  lift_duration: 30    # Number of steps to lift after sliding
  use_longitude_axis: True  # Whether to align the end-effector's longitude axis with the socket during approach
  approach_speed_range: [0.5, 2.0]   # Speed at which the end-effector approaches the plug
  press_speed_range: [0.05, 0.1]  # Speed at which the plug presses into the socket
  slide_speed_range: [0.5, 1.0]  # Speed at which the plug slides along the socket
  lift_speed_range: [0.5, 2.0]   # Speed at which the end-effector lifts after sliding
  air_speed_range: [0.3, 0.3]    # Speed at which the end-effector moves when not in contact
  # Noise added to the sampled velocities at each step (applied as +/- range for symmetric variation)
  approach_noise_range: [0.0, 0.02]  # Max absolute noise for approach velocity (applied as +/-0.1)
  press_noise_range: [0.0, 0.01]    # Max absolute noise for press velocity (applied as +/-0.01)
  slide_noise_range: [0.0, 0.01]     # Max absolute noise for slide velocity (applied as +/-0.1)
  lift_noise_range: [0.0, 0.01]     # Max absolute noise for lift velocity (applied as +/-0.05, reduced to prevent downward motion)
  air_noise_range: [0.0, 0.01]       # Max absolute noise for air velocity (applied as +/-0.1)
  rotation_noise_range: [0.0, 0.01] # Max absolute noise for rotational velocity (applied as +/-0.01)


# set default task and default training config based on task
defaults:
  # - task: TacSLDataCollectionPeg
  - task: TacSLDataCollectionTool
  - train: TacSLTaskInsertionPPO_LSTM_dict_AAC
  - pbt: no_pbt
  - override hydra/job_logging: disabled
  - _self_

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .
